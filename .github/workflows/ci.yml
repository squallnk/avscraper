name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check server tests

      # 真实页面固件不入库（见 docs/FIXTURES.md），依赖固件的用例会自动跳过，
      # 所以 CI 跑的是"不依赖真实页面"的那部分：分类、限速、存储边界、解析规则等。
      - name: 测试
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装并构建前端
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
