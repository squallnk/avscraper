# 示例：部署到 Unraid。第一次务必只挂测试目录。
services:
  avscraper:
    image: ghcr.io/<你的用户名>/avscraper:latest
    # 想自己构建就把上面那行换成：
    # build: .
    container_name: avscraper
    restart: unless-stopped
    ports:
      - "9300:9300"
    environment:
      - AVS_HOST=0.0.0.0
      - AVS_PORT=9300
      - AVS_DATA_DIR=/app/data
      - AVS_LOG_LEVEL=INFO
      # 只允许访问测试目录；正式库先不要写进来
      - AVS_ALLOWED_ROOTS=/media/media
    volumes:
      - /mnt/user/appdata/avscraper:/app/data
      # 要刮削的媒体目录（经 CloudDrive2 挂载）
      - /mnt/user/clouddrive/115/Test:/media/media
    # 若日志里出现域名解析失败，把 DNS 显式指向旁路由
    # dns:
    #   - 192.168.1.252
